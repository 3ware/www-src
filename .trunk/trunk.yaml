# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.18.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - pinact
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.21
    - cspell@10.4.0
    - dotenv-linter@3.3.0
    - git-diff-check
    - jsonvet@3.2.0
    - markdownlint@0.49.1
    - osv-scanner@1.9.2
    - oxipng@9.1.4
    - pre-commit-hooks@6.0.0:
        commands:
          - check-added-large-files
          - check-merge-conflict
          - check-yaml
          - detect-private-key
          - end-of-file-fixer
          - trailing-whitespace
    - prettier@3.9.9
    - renovate@44.127.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - trufflehog@3.97.9
    - yamllint@1.38.0
    - zizmor@1.30.0
  definitions:
    # actionlint has shellcheck integration for `run:` commands in GitHub Actions workflows
    # Adding shellcheck ensures trunk will also lint shell commands in GitHub Actions workflows
    - name: actionlint
      tools: [actionlint, shellcheck]
      # Match trunks shellcheck configuration for actionlint
      # actionlint plugin definition does not include the shellcheck configuration file
      environment:
        - name: SHELLCHECK_OPTS
          value: --enable=all
    # https://gitlab.com/bmares/check-json5
    # json files with comments fail standard check-json check
    - name: jsonvet
      description: pre-commit hook which verifies that .json files in a repository are valid JSON5
      runtime: python
      package: jsonvet
      version: 3.1.1
      commands:
        - name: lint
          output: pass_fail
          run: jsonvet ${target}
          success_codes: [0, 1]
          files: [json]
    - name: zizmor
      commands:
        # Set to pedantic so that zizmor will run its stale-action-refs audit rule
        - name: lint
          run: zizmor --format=sarif --persona=pedantic ${target}
  ignore:
    # CHANGELOG.md files generated by release-please
    - linters: [prettier, markdownlint]
      paths:
        - CHANGELOG.md
    # Binary images are owned by oxipng
    - linters: [pre-commit-hooks]
      paths:
        - static/img/**
actions:
  disabled:
    - commitlint
    - trunk-announce
  enabled:
    - actions-lock-verify
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
  definitions:
    - id: actions-lock-verify
      triggers:
        - git_hooks: [pre-commit]
      run: .trunk/scripts/actions-lock-verify.sh
tools:
  enabled:
    - gh@2.103.3

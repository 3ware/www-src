name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-slim
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.THREEWARE_RELEASE_APPLICATION_ID }}
          private-key: ${{ secrets.THREEWARE_RELEASE_APPLICATION_PRIVATE_KEY }}
          permission-contents: write # Required to update release-related files
          permission-issues: write # See: https://github.com/googleapis/release-please-action/tree/v5.0.0/#workflow-permissions
          permission-pull-requests: write # Required to create and update pull requests

      - name: Run Release Please
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

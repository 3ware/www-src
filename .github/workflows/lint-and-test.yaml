name: Lint and Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

# Disable permissions for all available scopes
permissions: {}

jobs:
  trunk:
    name: Trunk Code Quality
    permissions:
      contents: read
    uses: 3ware/workflows/.github/workflows/reusable-trunk-code-quality.yaml@v5.0.0
    secrets:
      threeware-bot-app-id: ${{ secrets.THREEWARE_RELEASE_APPLICATION_ID }}
      threeware-bot-private-key: ${{ secrets.THREEWARE_RELEASE_APPLICATION_PRIVATE_KEY }}

  test:
    needs: [trunk]
    name: Test
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true # lint fails to authenticate when false

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0

  build:
    name: Build
    needs: [test]
    uses: $/.github/workflows/hugo.yaml

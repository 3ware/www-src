name: Publish Website

on:
  release:
    types: [published]

# Disable permissions for all available scopes
permissions: {}

jobs:
  build-website:
    name: Build
    uses: $/.github/workflows/hugo.yaml

  publish-website:
    name: Publish
    needs: [build-website]
    runs-on: ubuntu-slim
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: 3ware-website
          path: ./public

      - name: Publish
        # cspell:disable-next-line
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          deploy_key: ${{ secrets.ACTION_DEPLOY_KEY }}
          external_repository: 3ware/www-public
          publish_dir: ./public # This is the source dir. ./public is the default.
          destination_dir: ./docs
          keep_files: true
          user_name: 3ware[bot]
          user_email: 3ware[bot]@users.noreply.github.com
          publish_branch: main
